services:
  app_proxy:
    environment:
      APP_HOST: docuseal_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false" #bypass umbrel proxy
    container_name: docuseal_app_proxy_1
  server:
    image: >-
      docuseal/docuseal:3.1.6@sha256:84b4e296b28738694273e62390c935f3e08f18ad161e19aae90dbfbbb3fa5bb7
    user: '1000:1000'
    depends_on:
      - db
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DATABASE_URL: >-
        postgresql://docusealuser:docusealpass@docuseal_db_1:5432/docuseal?sslmode=disable
      APPLICATION_HOST: ${CUSTOM_APPLICATION_HOST} #custom domain
      TRUSTED_PROXIES: ${CUSTOM_TRUSTED_PROXIES:-127.0.0.1} #custom proxy
      FORCE_SSL: "true"
    volumes:
      - ${APP_DATA_DIR}/data/app:/data/docuseal
    container_name: docuseal_server_1
  db:
    image: >-
      postgres:17.3@sha256:0321e2252ebfeecb8bc1a899755084d29bce872953e1a5a3e25ec0860b739098
    user: '1000:1000'
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docusealuser
      POSTGRES_PASSWORD: docusealpass
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    container_name: docuseal_db_1